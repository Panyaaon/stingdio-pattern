<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>STINGDiO Pattern Gallery</title>
<style>
:root{--pink:#ff6fae;--pink2:#ff8fbd;--soft:#ffe4ef;--pale:#fff8fb;--ink:#19171b;--muted:#8b8188;--line:#f3bfd3;--white:#fff;--shadow:0 10px 28px rgba(255,111,174,.10)}
*{box-sizing:border-box} html{scroll-behavior:smooth}
body{margin:0;font-family:ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(180deg,#fffafd 0%,#fff4fa 100%);min-height:100vh}
button,input,select{font:inherit} button{-webkit-tap-highlight-color:transparent}
.app{max-width:1080px;margin:0 auto;min-height:100vh;padding-bottom:28px;position:relative}
.app:before,.app:after{content:"♡";position:fixed;color:#ffc2dc;font-size:28px;pointer-events:none;opacity:.8} .app:before{left:10px;top:34%} .app:after{right:10px;top:62%}
.header{padding:22px 18px 10px}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:2px} .logo{width:92px;height:auto;display:block;mix-blend-mode:multiply} .brand-title{font-size:22px;font-weight:900;color:#765064;letter-spacing:-.4px}
.tagline{font-size:17px;font-weight:900;color:#8c5f78;text-align:center;line-height:1.05;transform:rotate(-4deg);padding:4px 12px 0 0} .tagline b{color:var(--pink)}

.controls{padding:0 18px 12px;display:grid;gap:11px}
.top-controls{display:grid;grid-template-columns:minmax(0,1.5fr) auto auto;gap:10px;align-items:center}
.search-wrap{position:relative} .search-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:18px;color:#4f4a4e} .search{width:100%;border:1px solid var(--line);border-radius:16px;padding:13px 44px 13px 42px;background:#fff;outline:none;box-shadow:0 5px 16px rgba(255,111,174,.06)} .search-clear{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;border-radius:50%;background:#ffe6f0;color:#ff5d9f;font-size:18px;font-weight:900;line-height:1;display:none;align-items:center;justify-content:center;cursor:pointer}.search-clear.show{display:flex}.search-clear:active{transform:translateY(-50%) scale(.94)}
.tabs{display:flex;gap:8px} .tab{border:1px solid #f2c3d5;background:#fff;color:#5c565b;border-radius:999px;padding:10px 17px;font-weight:850;cursor:pointer} .tab.active{background:linear-gradient(180deg,#ff83b5,#ff6fae);border-color:#ff6fae;color:#fff;box-shadow:0 5px 14px rgba(255,111,174,.16)}
.view-switch{display:flex;border:1px solid #f3c5d7;border-radius:15px;overflow:hidden;background:#fff;min-width:190px} .view-btn{flex:1;border:0;background:#fff;color:#777078;padding:8px 11px;font-size:12px;font-weight:900;cursor:pointer;line-height:1.15} .view-btn+ .view-btn{border-left:1px solid #f3c5d7} .view-btn.active{background:#ffe1ed;color:#ff5d9f} .view-icon{display:block;font-size:17px;margin-bottom:2px}

.creator{margin:4px 18px 18px;padding:13px 14px;border:1px solid #f5c6d8;border-radius:18px;background:rgba(255,255,255,.78);box-shadow:0 8px 24px rgba(255,111,174,.07)}
.creator-row{display:grid;grid-template-columns:auto minmax(190px,1fr) 160px auto;gap:10px;align-items:center}
.upload-head{display:flex;align-items:center;gap:10px;min-width:210px} .plus-box{width:52px;height:52px;border-radius:14px;background:linear-gradient(180deg,#ff83b5,#ff6fae);color:white;display:grid;place-items:center;font-size:31px;box-shadow:0 6px 15px rgba(255,111,174,.18)} .upload-copy strong{display:block;font-size:14px} .upload-copy small{display:block;margin-top:3px;color:#91858d;font-size:11px}
.field,.select{width:100%;border:1px solid #efbfd2;border-radius:13px;padding:12px 13px;background:#fff;outline:none;color:#3e393d;font-weight:800} .field:focus,.select:focus{border-color:#ff85b6;box-shadow:0 0 0 3px rgba(255,111,174,.08)}
.upload-btn{border:1px solid #ff7eaf;border-radius:13px;padding:12px 18px;background:linear-gradient(180deg,#ff87b8,#ff6fae);color:#fff;font-weight:950;cursor:pointer;white-space:nowrap;box-shadow:0 6px 16px rgba(255,111,174,.18)} #patternUpload{display:none}
.count-row{padding:0 20px 10px;display:flex;justify-content:flex-end;color:#a0949b;font-size:12px;font-weight:800}

.gallery{display:grid;grid-template-columns:1fr;gap:18px;padding:0 18px 24px} .gallery.cols-2{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{background:rgba(255,255,255,.96);border:1px solid #f1c8d8;border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.thumb{position:relative;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:230px} .thumb img{width:100%;height:auto;max-height:80vh;object-fit:contain;display:block;background:#fff} .gallery.cols-2 .thumb{min-height:160px} .gallery.cols-2 .thumb img{max-height:50vh}
.fav{position:absolute;right:9px;top:9px;width:42px;height:42px;border-radius:50%;border:1px solid #f3c6d8;background:rgba(255,255,255,.96);display:grid;place-items:center;color:#ff69a7;font-size:24px;box-shadow:0 5px 14px rgba(255,111,174,.10)}
.meta{padding:12px 14px 14px} .title{font-weight:1000;font-size:21px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.25px} .title-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}.title-row .title{margin-bottom:0;min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.title-actions{display:flex;align-items:center;flex:0 0 auto}.mini-action{height:29px;border:1px solid #efbfd2;background:#fff;border-radius:999px;color:#6f5261;display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:0 10px;font-size:10px;font-weight:900;cursor:pointer;white-space:nowrap}.mini-action:active{transform:scale(.96)}
.info{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px} .left-info{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0;width:100%} .badge{display:inline-flex;align-items:center;border-radius:999px;padding:6px 13px;background:#ffdce9;color:#ff5f9f;font-size:11px;font-weight:1000} .grid-size{display:inline-flex;align-items:center;gap:6px;color:#827a80;font-size:12px;font-weight:850;white-space:nowrap} .grid-icon{font-size:16px;color:#706b70} .date{font-size:11px;color:#a0979c;white-space:nowrap}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px} .action-btn{height:42px;border:1px solid #f0b9d0;border-radius:13px;background:#fff;color:#2f2b2e;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px} .action-btn.primary{background:linear-gradient(180deg,#ffe4ef,#ffd8e9)} .action-icon{font-size:17px}
.gallery.cols-2 .meta{padding:10px 10px 11px} .gallery.cols-2 .title-row{gap:7px;margin-bottom:8px}.gallery.cols-2 .mini-action{height:26px;font-size:9px;padding:0 9px;border-radius:999px} .gallery.cols-2 .title{font-size:16px} .gallery.cols-2 .info{gap:6px} .gallery.cols-2 .left-info{gap:6px} .gallery.cols-2 .badge{font-size:10px;padding:5px 10px} .gallery.cols-2 .grid-size{font-size:10px;gap:4px} .gallery.cols-2 .date{font-size:10px} .gallery.cols-2 .actions{gap:6px;margin-top:9px} .gallery.cols-2 .action-btn{height:36px;font-size:10px;padding:6px 4px;gap:4px} .gallery.cols-2 .action-icon{font-size:14px} .gallery.cols-2 .fav{width:34px;height:34px;font-size:19px;right:7px;top:7px}
.placeholder{padding:40px 18px;text-align:center;color:#958992;font-weight:900}
.load-more-wrap{display:none;padding:0 18px 8px;text-align:center} .load-more{width:min(100%,290px);border:1px solid #f0aeca;border-radius:999px;padding:12px 18px;background:linear-gradient(180deg,#ff82b6,#ff6fae);color:#fff;font-weight:1000;cursor:pointer;box-shadow:0 8px 20px rgba(255,111,174,.16)} .showing{text-align:center;color:#a2969e;font-size:11px;margin-top:8px}
.empty{display:none;margin:0 18px 24px;padding:28px;border:1px dashed #eebcd1;border-radius:18px;background:#fff;text-align:center;font-weight:900;color:#8a7c84}
footer{margin:28px 18px 0;padding:18px 0;border-top:1px solid #f3cad9;display:flex;justify-content:space-between;gap:10px;font-size:12px;color:#8d6b7d;font-weight:850}
@media(max-width:760px){.top-controls{grid-template-columns:1fr} .tabs{justify-content:center} .view-switch{width:100%} .creator-row{grid-template-columns:1fr 110px} .upload-head{grid-column:1/-1} .upload-btn{grid-column:1/-1} .tagline{display:none}}
@media(max-width:520px){.header{padding:16px 12px 8px} .controls{padding:0 12px 10px} .creator{margin:4px 12px 14px;padding:11px} .gallery{padding:0 12px 20px;gap:12px} .gallery.cols-2{gap:8px} .logo{width:78px} .brand-title{font-size:18px} .creator-row{grid-template-columns:1fr 96px} .upload-head{min-width:0} .plus-box{width:44px;height:44px;font-size:26px} .upload-copy small{font-size:10px} .gallery.cols-2 .title{font-size:14px} .gallery.cols-2 .meta{padding:8px} .gallery.cols-2 .action-btn{height:33px;font-size:9px} .gallery.cols-2 .action-icon{font-size:12px} .gallery.cols-2 .date{display:none}}

/* ===== Mobile fit refinements ===== */
@media (max-width: 600px){
  html,body{width:100%;max-width:100%;overflow-x:hidden}
  body{background:linear-gradient(180deg,#fffafd 0%,#fff5fa 100%)}
  .app{width:100%;max-width:100%;padding-bottom:18px;overflow:hidden}
  .app:before,.app:after{display:none}

  .header{padding:14px 12px 8px}
  .topbar{align-items:flex-start;gap:8px}
  .logo{width:68px}
  .brand{gap:1px}
  .brand-title{font-size:16px;line-height:1.05}
  .tagline{display:none}

  .controls{padding:0 12px 10px;gap:8px}
  .top-controls{display:grid;grid-template-columns:1fr;gap:8px}
  .search{height:42px;padding:10px 38px 10px 40px;border-radius:14px;font-size:14px}
  .search-icon{left:13px;font-size:17px}
  .search-heart{right:12px;font-size:16px}

  .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%}
  .tab{width:100%;padding:9px 6px;font-size:12px}

  .view-switch{width:100%;min-width:0;border-radius:13px}
  .view-btn{padding:7px 6px;font-size:10px;min-width:0}
  .view-icon{font-size:15px;margin-bottom:1px}

  .creator{margin:2px 12px 12px;padding:10px;border-radius:16px}
  .creator-row{grid-template-columns:minmax(0,1fr) 104px;gap:7px}
  .upload-head{grid-column:1/-1;min-width:0;gap:8px}
  .plus-box{width:40px;height:40px;border-radius:11px;font-size:24px;flex:0 0 auto}
  .upload-copy strong{font-size:12px;line-height:1.15}
  .upload-copy small{font-size:9px;margin-top:2px}
  .field{grid-column:1/-1;height:40px;padding:9px 11px;font-size:12px;border-radius:11px}
  .select{height:40px;padding:9px 9px;font-size:12px;border-radius:11px}
  .upload-btn{grid-column:auto;height:40px;padding:9px 8px;border-radius:11px;font-size:12px;box-shadow:none}

  .count-row{padding:0 13px 7px;font-size:10px}

  .gallery{padding:0 10px 18px;gap:12px}
  .gallery.cols-2{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .card{border-radius:14px;box-shadow:0 5px 16px rgba(255,111,174,.08)}
  .thumb{min-height:0;aspect-ratio:auto}
  .thumb img{width:100%;height:auto;max-height:none;object-fit:contain}
  .gallery.cols-2 .thumb{min-height:0}
  .gallery.cols-2 .thumb img{max-height:none}
  .fav{width:30px;height:30px;right:6px;top:6px;font-size:17px;box-shadow:none}

  .meta{padding:10px 10px 11px}
  .title{font-size:16px;line-height:1.12}
  .info{margin-top:7px;gap:6px}
  .left-info{gap:6px;min-width:0;flex-wrap:wrap}
  .badge{padding:5px 9px;font-size:9px}
  .grid-size{font-size:10px;gap:4px}
  .grid-icon{font-size:13px}
  .date{display:none}
  .actions{gap:6px;margin-top:9px}
  .action-btn{height:36px;border-radius:11px;font-size:10px;gap:4px;padding:5px 3px;white-space:nowrap}
  .action-icon{font-size:13px}

  .gallery.cols-2 .meta{padding:7px 7px 8px}
  .gallery.cols-2 .title{font-size:12px;letter-spacing:-.15px}
  .gallery.cols-2 .info{margin-top:6px;display:block}
  .gallery.cols-2 .left-info{display:flex;gap:4px;flex-wrap:nowrap;overflow:hidden}
  .gallery.cols-2 .badge{padding:4px 7px;font-size:8px;flex:0 0 auto}
  .gallery.cols-2 .grid-size{font-size:8px;gap:3px;min-width:0}
  .gallery.cols-2 .grid-icon{font-size:11px}
  .gallery.cols-2 .actions{gap:4px;margin-top:7px}
  .gallery.cols-2 .action-btn{height:30px;font-size:8px;border-radius:9px;padding:4px 2px;gap:2px;min-width:0}
  .gallery.cols-2 .action-icon{font-size:10px}
  .gallery.cols-2 .fav{width:25px;height:25px;font-size:14px;right:5px;top:5px}

  .load-more-wrap{padding:0 12px 8px}
  .load-more{width:min(100%,250px);padding:10px 14px;font-size:12px}
  .showing{font-size:9px}
  .empty{margin:0 12px 18px;padding:20px;font-size:12px}
  footer{margin:20px 12px 0;padding:14px 0;font-size:9px;gap:6px;white-space:nowrap}
}

@media (max-width: 380px){
  .gallery{padding-left:8px;padding-right:8px}
  .gallery.cols-2{gap:6px}
  .gallery.cols-2 .title{font-size:11px}
  .gallery.cols-2 .badge{font-size:7px;padding:4px 6px}
  .gallery.cols-2 .grid-size{font-size:7px}
  .gallery.cols-2 .action-btn{font-size:7px;height:28px}
  .creator-row{grid-template-columns:minmax(0,1fr) 94px}
}


/* Card overlay layout */
.thumb .badge.overlay-tag{position:absolute;left:9px;top:9px;z-index:3;box-shadow:0 3px 10px rgba(255,111,174,.10);background:rgba(255,238,246,.94);backdrop-filter:blur(5px)}
.thumb .grid-size.overlay-size{position:absolute;right:9px;bottom:9px;z-index:3;background:rgba(255,255,255,.94);border:1px solid #f3c5d7;border-radius:999px;padding:5px 9px;box-shadow:0 3px 10px rgba(90,70,80,.08);backdrop-filter:blur(5px)}
.title-row{margin-bottom:0}
.mini-action{height:34px;padding:0 12px;background:#fff0f6;border-color:#ffafd0;color:#ff5d9f;font-size:11px;gap:5px}
.mini-action .view-glass{font-size:19px;line-height:1;font-weight:900}
.gallery.cols-2 .mini-action{height:30px;padding:0 10px;font-size:9px}.gallery.cols-2 .mini-action .view-glass{font-size:17px}
@media(max-width:520px){.thumb .badge.overlay-tag{left:7px;top:7px}.thumb .grid-size.overlay-size{right:7px;bottom:7px;padding:4px 7px}.gallery.cols-2 .mini-action{height:29px;padding:0 8px}.gallery.cols-2 .mini-action .view-glass{font-size:17px}}
</style>
</head>

<script>
// ============================================================
// STINGDiO AUTO GALLERY — FOLDER MODE
// แยกรูปใน GitHub เป็น 2 โฟลเดอร์:
//   /anime/   → Anime
//   /kpop/    → K-POP
// ชื่อไฟล์ไม่ต้องใส่ anime- หรือ kpop- แล้ว
// ตัวอย่าง: anime/IMG_6897.jpg  และ  kpop/IMG_6900.jpg
// ============================================================

const PAGE_SIZE = 20;
let patterns = [];
let previewPatterns = [];
let activeFilter = 'all';
let columns = 2;
let visibleCount = PAGE_SIZE;

const gallery = document.getElementById('gallery');
const count = document.getElementById('count');
const empty = document.getElementById('empty');
const search = document.getElementById('search');
const searchClear = document.getElementById('searchClear');
const loadMoreWrap = document.getElementById('loadMoreWrap');
const loadMoreBtn = document.getElementById('loadMoreBtn');
const showing = document.getElementById('showing');

function escapeHTML(v){
  return String(v).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
}

function prettyTitle(filename){
  return filename
    .replace(/\.[^.]+$/,'')
    .replace(/[_-]+/g,' ')
    .replace(/\s+/g,' ')
    .trim()
    .replace(/\w/g,c=>c.toUpperCase());
}

function isImage(filename){
  return /\.(png|jpe?g|webp|gif)$/i.test(filename);
}

function getGitHubLocation(){
  // GitHub Pages แบบ username.github.io/repository/
  if(location.hostname.endsWith('.github.io')){
    const owner = location.hostname.split('.')[0];
    const firstPath = location.pathname.split('/').filter(Boolean)[0];
    const repo = firstPath || `${owner}.github.io`;
    return {owner,repo};
  }
  return null;
}

function normalizeFolderName(name){
  return String(name).toLowerCase().replace(/[\s_-]+/g,'');
}

async function loadPatternsFromGitHub(){
  const gh = getGitHubLocation();
  if(!gh){
    patterns = [];
    count.textContent = 'Open with GitHub Pages to load patterns';
    empty.style.display = 'block';
    empty.innerHTML = 'กรุณาเปิดเว็บผ่าน GitHub Pages เพื่อโหลดรูปจากโฟลเดอร์ <b>anime</b> และ <b>kpop</b> ♡';
    return;
  }

  count.textContent = 'Loading patterns...';
  empty.style.display = 'none';

  try{
    const rootApi = `https://api.github.com/repos/${encodeURIComponent(gh.owner)}/${encodeURIComponent(gh.repo)}/contents/`;
    const rootRes = await fetch(rootApi,{headers:{'Accept':'application/vnd.github+json'}});
    if(!rootRes.ok) throw new Error(`GitHub API ${rootRes.status}`);
    const rootItems = await rootRes.json();

    const dirs = rootItems.filter(item=>item.type==='dir');
    const animeDir = dirs.find(d=>normalizeFolderName(d.name)==='anime');
    const kpopDir = dirs.find(d=>['kpop','k-pop'].includes(String(d.name).toLowerCase()) || normalizeFolderName(d.name)==='kpop');

    const jobs = [];
    if(animeDir) jobs.push(fetch(animeDir.url,{headers:{'Accept':'application/vnd.github+json'}}).then(r=>{if(!r.ok) throw new Error(`Anime folder ${r.status}`); return r.json();}).then(files=>({category:'anime',files})));
    if(kpopDir) jobs.push(fetch(kpopDir.url,{headers:{'Accept':'application/vnd.github+json'}}).then(r=>{if(!r.ok) throw new Error(`KPOP folder ${r.status}`); return r.json();}).then(files=>({category:'kpop',files})));

    if(!jobs.length){
      patterns=[];
      visibleCount=PAGE_SIZE;
      render();
      empty.style.display='block';
      empty.innerHTML='ยังไม่พบโฟลเดอร์ <b>anime</b> หรือ <b>kpop</b> ใน GitHub ♡';
      return;
    }

    const results = await Promise.all(jobs);
    patterns = results.flatMap(group => group.files
      .filter(f=>f.type==='file' && isImage(f.name))
      .map(f=>({
        title: prettyTitle(f.name),
        category: group.category,
        image: f.download_url || f.path,
        size: '38 × 38',
        filename: f.name
      }))
    ).sort((a,b)=>a.title.localeCompare(b.title,undefined,{numeric:true,sensitivity:'base'}));

    visibleCount = PAGE_SIZE;
    render();
  }catch(err){
    console.error(err);
    patterns=[];
    count.textContent='Could not load GitHub images';
    empty.style.display='block';
    empty.innerHTML='โหลดรูปจาก GitHub ไม่สำเร็จ ♡<br><small>เช็กว่า Repository เป็น Public และมีโฟลเดอร์ anime / kpop</small>';
  }
}

function cardHTML(item){
  const title = escapeHTML(item.title);
  const src = item.image || '';
  const tag = item.category === 'anime' ? 'Anime' : 'K-POP';
  const size = escapeHTML(item.size || '38 × 38');
  const media = src
    ? `<img src="${src}" alt="${title}" loading="lazy">`
    : `<div class="placeholder">♡<br>${title}</div>`;

  return `<article class="card">
    <div class="thumb">${media}<span class="badge overlay-tag">${tag}</span><div class="fav">♡</div><span class="grid-size overlay-size"><span class="grid-icon">▦</span>${size}</span></div>
    <div class="meta">
      <div class="title-row">
        <div class="title">${title}</div>
        <div class="title-actions">
          <button class="mini-action" aria-label="View pattern" onclick="openPattern('${src.replace(/'/g,"\\'")}')"><span class="view-glass">⌕</span><span>View</span></button>
        </div>
      </div>
    </div>
  </article>`;
}

function render(){
  const q = search.value.trim().toLowerCase();
  const allItems = [...previewPatterns, ...patterns];
  const filtered = allItems.filter(p =>
    (activeFilter === 'all' || p.category === activeFilter) &&
    (!q || p.title.toLowerCase().includes(q))
  );
  const visible = filtered.slice(0, visibleCount);
  gallery.innerHTML = visible.map(cardHTML).join('');
  gallery.classList.toggle('cols-2', columns === 2);
  count.textContent = filtered.length > PAGE_SIZE ? `${visible.length} / ${filtered.length} items` : `${filtered.length} items`;
  empty.style.display = filtered.length ? 'none' : 'block';
  if(!filtered.length) empty.innerHTML = 'ยังไม่มีรูปในโฟลเดอร์ <b>anime</b> หรือ <b>kpop</b> ♡';
  loadMoreWrap.style.display = filtered.length > visibleCount ? 'block' : 'none';
  showing.textContent = `Showing ${visible.length} of ${filtered.length} patterns`;
}

function openPattern(src){ if(src) window.open(src,'_blank'); }
function downloadPattern(src,title){
  if(!src) return;
  const a = document.createElement('a');
  a.href = src;
  a.download = title || 'pattern';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  activeFilter = btn.dataset.filter;
  visibleCount = PAGE_SIZE;
  render();
}));

document.querySelectorAll('.view-btn').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('.view-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  columns = Number(btn.dataset.cols);
  render();
}));

function updateSearchClear(){ searchClear.classList.toggle('show', search.value.length > 0); }
search.addEventListener('input',()=>{visibleCount=PAGE_SIZE;updateSearchClear();render();});
searchClear.addEventListener('click',()=>{search.value='';visibleCount=PAGE_SIZE;updateSearchClear();render();search.focus();});
updateSearchClear();
loadMoreBtn.addEventListener('click',()=>{visibleCount+=PAGE_SIZE;render();});


loadPatternsFromGitHub();
</script>
</body>
